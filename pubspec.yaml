name: offynexbd
description: "OFFYNEXBD - The Future of Office Productivity"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.4.0
  shared_preferences: ^2.5.3
  flutter_quill: ^11.6.0
  cupertino_ui: ^1.1.5
  file_picker: ^13.3.3
  excel_community: ^2.6.2
  path_provider: ^2.1.5
  pdf: ^3.13.1
  bangla_pdf: ^1.9.2
  printing: ^5.14.2
  docx_creator: ^1.2.3
  archive: ^4.0.7
  xml: ^7.0.1
  tesseract_ocr: ^0.6.0
  google_mlkit_document_scanner: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/offynexbd_logo.svg
    - assets/branding/founder_profile.jpg
    - assets/fonts/NotoSansBengali.ttf
    - assets/fonts/NotoSerifBengali.ttf
    - assets/fonts/NotoSans.ttf
    - assets/tessdata_config.json
    - assets/tessdata/
