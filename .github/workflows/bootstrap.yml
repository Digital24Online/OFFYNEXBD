name: OFFYNEXBD Flutter Setup
# CI validates the Flutter source, widget tests, and release APK.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'lib/**'
      - 'modules/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'modules/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

# Keep only the newest main-branch validation running after rapid source commits.
concurrency:
  group: offynexbd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --platforms=android,ios,windows,macos --org com.offynexbd --project-name offynexbd .
          fi

      - name: Prepare Bengali PDF font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 --output assets/fonts/NotoSansBengali.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/NotoSansBengali%5Bwdth,wght%5D.ttf'
          test -s assets/fonts/NotoSansBengali.ttf
          curl --fail --location --retry 3 --output assets/fonts/NotoSerifBengali.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifbengali/NotoSerifBengali%5Bwdth%2Cwght%5D.ttf'
          test -s assets/fonts/NotoSerifBengali.ttf
          curl --fail --location --retry 3 --output assets/fonts/NotoSans.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf'
          test -s assets/fonts/NotoSans.ttf
          curl --fail --location --retry 3 --output assets/fonts/OFL.txt 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/OFL.txt'
          test -s assets/fonts/OFL.txt
          mkdir -p assets/tessdata
          curl --fail --location --retry 3 --output assets/tessdata/ben.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ben.traineddata'
          test -s assets/tessdata/ben.traineddata
          curl --fail --location --retry 3 --output assets/tessdata/eng.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata'
          test -s assets/tessdata/eng.traineddata

      - name: Prepare App Branding
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1024 --height 1024 assets/branding/offynexbd_icon.svg > assets/branding/offynexbd_app_icon.png
          test -s assets/branding/offynexbd_app_icon.png
          # Approved Option 2 full wordmark for Android and iOS launch screens.
          rsvg-convert --width 1024 --height 1024 assets/branding/offynexbd_logo.svg > assets/branding/offynexbd_splash.png
          test -s assets/branding/offynexbd_splash.png
          mkdir -p android/app/src/main/res/drawable-nodpi ios/Runner/Assets.xcassets/LaunchImage.imageset
          cp assets/branding/offynexbd_splash.png android/app/src/main/res/drawable-nodpi/offynexbd_splash.png
          rsvg-convert --width 512 --height 512 assets/branding/offynexbd_logo.svg > ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage.png
          rsvg-convert --width 1024 --height 1024 assets/branding/offynexbd_logo.svg > ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@2x.png
          rsvg-convert --width 1536 --height 1536 assets/branding/offynexbd_logo.svg > ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@3x.png
          test -s android/app/src/main/res/drawable-nodpi/offynexbd_splash.png
          test -s ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@3x.png

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Platform Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Decode Android Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          
      - name: Verify Android Signing Key Before Build
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="android/app/upload-keystore.jks"
          test -s "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" > /tmp/offynexbd-signing.txt
          ACTUAL_CERT_SHA256="$(awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}' /tmp/offynexbd-signing.txt)"
          EXPECTED_CERT_SHA256="7a132720dbf3c991e75f530eb095fafa6ad9ccbbe8449283b005eb9367268677"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Android signing certificate does not match the installed OFFYNEXBD app."
            echo "Expected certificate: $EXPECTED_CERT_SHA256"
            echo "Actual certificate:   $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Android signing key matches the OFFYNEXBD update certificate."

      - name: Install Android NDK (retry on corrupt download)
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "Android SDK path not found"
            exit 1
          fi
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          NDK_DIR="$ANDROID_SDK/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt/3"
            rm -rf "$NDK_DIR"
            set +o pipefail
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              set -o pipefail
              if [ -d "$NDK_DIR" ]; then
                break
              fi
            else
              set -o pipefail
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
          test -d "$NDK_DIR"

      - name: Build Android APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Verify Release APK Signature and Install Metadata
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_SDK"
          APKSIGNER="$(find "$ANDROID_SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/app/outputs/flutter-apk/APK_SIGNATURE.txt
          grep -Eqi "(Signer #1|V[0-9]+ Signer): certificate SHA-256 digest: 7a132720dbf3c991e75f530eb095fafa6ad9ccbbe8449283b005eb9367268677" build/app/outputs/flutter-apk/APK_SIGNATURE.txt
          "$AAPT" dump badging "$APK" | tee build/app/outputs/flutter-apk/APK_INSTALL_INFO.txt
          grep -q "package: name='com.offynexbd.offynexbd'" build/app/outputs/flutter-apk/APK_INSTALL_INFO.txt
          EXPECTED_VERSION_CODE="$BUILD_NUMBER"
          ACTUAL_VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" build/app/outputs/flutter-apk/APK_INSTALL_INFO.txt | head -n 1)"
          test -n "$ACTUAL_VERSION_CODE"
          if [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "ERROR: APK versionCode ($ACTUAL_VERSION_CODE) does not match this workflow run ($EXPECTED_VERSION_CODE)."
            exit 1
          fi
          echo "Verified update package: package=com.offynexbd.offynexbd versionCode=$ACTUAL_VERSION_CODE"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/APK_SHA256.txt

      - name: Remove Android Signing Files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/upload-keystore.jks

      - name: Save Generated Source
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Create OFFYNEXBD Flutter foundation"
            # A merge or documentation commit may land after checkout. Rebase
            # the generated-source commit onto the latest branch before push.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push attempt ${attempt} was rejected; fetching and rebasing again."
            done
            echo "Unable to publish generated Flutter source after three attempts."
            exit 1
          fi

      - name: Verify Download Package Contents
        run: |
          set -euo pipefail
          OUTPUT="build/app/outputs/flutter-apk"
          test -s "$OUTPUT/app-release.apk"
          test -s "$OUTPUT/APK_SIGNATURE.txt"
          test -s "$OUTPUT/APK_INSTALL_INFO.txt"
          test -s "$OUTPUT/APK_SHA256.txt"
          grep -q 'com.offynexbd.offynexbd' "$OUTPUT/APK_INSTALL_INFO.txt"
          grep -Eq '(Signer #1|V[0-9]+ Signer): certificate SHA-256 digest' "$OUTPUT/APK_SIGNATURE.txt"
          ls -lh "$OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OFFYNEXBD-Android-APK
          path: build/app/outputs/flutter-apk/
          retention-days: 14
          
