name: OFFYNEXBD Flutter Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --platforms=android,ios,windows,macos --org com.offynexbd --project-name offynexbd .
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save Generated Source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Create OFFYNEXBD Flutter foundation"
            git push
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OFFYNEXBD-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
